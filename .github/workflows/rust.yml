name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo
          target/
        key: ${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          ${{ runner.os }}-
    - name: Build & lint
      run: |
        cargo build --verbose
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings
    - name: Tests
      run: |
        cargo test

  licenses:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DASH_VERSION: 1.1.0
      DASH_SHA256: ba4e84e1981f0e51f92a42ec8fc8b9668dabb08d1279afde46b8414e11752b06

    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Cache the Eclipse Dash license tool
      id: dash-cache
      uses: actions/cache@v6
      with:
        path: dash-licenses.jar
        key: dash-licenses-${{ env.DASH_VERSION }}
    - name: Download the Eclipse Dash license tool
      if: steps.dash-cache.outputs.cache-hit != 'true'
      run: |
        curl -fsSL -o dash-licenses.jar \
          https://clementd-files.cellar-c2.services.clever-cloud.com/org.eclipse.dash.licenses-$DASH_VERSION.jar
    - name: Verify the Eclipse Dash license tool
      run: echo "$DASH_SHA256  dash-licenses.jar" | sha256sum -c
    - name: Check dependency licenses
      # the tool exits with the number of dependencies that are not approved
      shell: bash
      run: |
        cargo tree --locked -e normal --prefix none --no-dedupe \
          | sort -u \
          | grep -v '^[[:space:]]*$' \
          | grep -v biscuit \
          | sed -E 's|([^ ]+) v([^ ]+).*|crate/cratesio/-/\1/\2|' \
          | java -jar dash-licenses.jar -summary DEPENDENCIES -
    - name: Upload the license summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependencies-licenses
        path: DEPENDENCIES

  advisories:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories bans sources
